<title>Atom Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --paper:#EEF3F1; --panel:#FFFFFF; --panel-2:#F5F9F7; --ink:#16252E; --muted:#56666D; --line:#D3DFDA;
  --accent:#1A74B3; --accent-soft:#E2EFF8; --accent-ink:#0F4F7D;
  --flame:#E9821C; --flame-soft:#FDEBD6; --flame-ink:#8A4508;
  --good:#23945A; --good-soft:#DFF3E7; --good-ink:#17643C;
  --warn:#C08108; --warn-soft:#FAF0D6; --warn-ink:#704B03;
  --danger:#C93A33; --danger-soft:#FAE2DF; --danger-ink:#8B211B;
  --radius:16px;
  --shadow:0 1px 2px rgba(22,37,46,.06), 0 8px 22px rgba(22,37,46,.06);
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.app{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:10px 36px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:.2px;line-height:1}
.brand svg{width:38px;height:38px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--muted)}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.settings{margin-left:auto;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.setting{display:flex;align-items:center;gap:6px}
.setting-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* shared */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.card p{margin:6px 0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:12px;font-weight:800;cursor:pointer;line-height:1.2;transition:transform .08s ease, background .15s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[aria-pressed="true"].hot{background:var(--flame);border-color:var(--flame);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.chem{background:var(--flame-soft);color:var(--flame-ink)}
.pill.phys{background:var(--accent-soft);color:var(--accent-ink)}
.pill.none{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.f{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}

/* LAB */
.lab{display:grid;grid-template-columns:248px minmax(0,1fr) 350px;gap:16px;align-items:start}
.shelf{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);position:sticky;top:10px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.shelf-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.shelf-filters{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.shelf-filters button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
.shelf-filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:calc(100vh - 170px);overflow:auto;padding:2px;margin:-2px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px 6px 7px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .1s ease, box-shadow .15s, border-color .15s;min-width:0}
.item:hover{border-color:#a9c4d6;box-shadow:0 4px 12px rgba(26,116,179,.12);transform:translateY(-1px)}
.item svg{width:46px;height:46px;flex:none}
.item .nm{font-weight:800;font-size:12.5px;line-height:1.2;text-wrap:balance}
.item .fm{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.item .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%}
.dot.home{background:var(--good)} .dot.adult{background:var(--warn)} .dot.lab{background:var(--danger)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:var(--radius);overflow:hidden;background:#dfe9e5;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:manipulation}
.scene canvas{display:block;width:100%;height:100%}
.scene.drop-over{outline:3px dashed var(--accent);outline-offset:-8px}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.gauge{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:6px 10px 7px;min-width:132px;font-size:12.5px;box-shadow:0 2px 8px rgba(22,37,46,.08)}
.gauge .row{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.gauge .val{font-variant-numeric:tabular-nums}
.gauge .bar{position:relative;height:8px;border-radius:5px;margin-top:5px}
.gauge .mark{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px #fff;transform:translateX(-50%);transition:left .6s ease}
.gauge .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.ph-bar{background:linear-gradient(90deg,#d7263d,#e0508a 18%,#a2479d 36%,#6b3fa0 50%,#3f5fc0 60%,#2f8f9d 70%,#3aa35a 84%,#d8c93a)}
.t-bar{background:linear-gradient(90deg,#4aa3df,#9fd0a8 22%,#f2c14e 55%,#e9821c 78%,#c93a33)}
.banner{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);opacity:0;transition:opacity .3s ease, transform .3s ease;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:18px;padding:8px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.banner.show{opacity:1;transform:translate(-50%,0)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .spacer{flex:1}
.contents{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700;min-height:28px}
.contents .c{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.contents .c i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}

.guide{display:flex;flex-direction:column;gap:12px;min-width:0}
.prof{display:flex;gap:10px;align-items:flex-start}
.prof svg{width:66px;height:66px;flex:none}
.prof .orbit{transform-origin:33px 33px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 13px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--accent-ink)}
.mission .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mission .goal{font-weight:700}
.mission.done{border-color:#9fd5b5;background:linear-gradient(180deg,#f3fbf6,#fff 70%)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.dots button{width:13px;height:13px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dots button.done{background:var(--good)}
.dots button.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.hint{font-size:14px;background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.star{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--good-ink)}
.star svg{width:20px;height:20px}
.result{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.result .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.signs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.sign{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:#8a979c;background:var(--panel-2)}
.sign.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.eq{font-family:var(--mono);font-size:13.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.eq.words{font-family:var(--body);font-weight:700;white-space:normal;font-size:14px}
.eq .lbl{font-family:var(--body);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);display:block;margin-bottom:1px}
.meta{font-size:13px;color:var(--muted);font-weight:700;margin:4px 0}
.fact{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 11px;margin:10px 0 8px;color:#123d5c}
.fact b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
.safety{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:800;padding:7px 10px;border-radius:10px;margin-top:8px}
.safety svg{width:17px;height:17px;flex:none;margin-top:1px}
.safety.s-home{background:var(--good-soft);color:var(--good-ink)}
.safety.s-adult{background:var(--warn-soft);color:var(--warn-ink)}
.safety.s-lab{background:var(--danger-soft);color:var(--danger-ink)}
.chain{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.chain h4{font-family:var(--display);font-weight:600;font-size:16px;margin:2px 0 4px}
.disc .bar{height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 8px}
.disc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#39a0d8);border-radius:6px;transition:width .5s ease}
.disc .list{display:flex;flex-wrap:wrap;gap:5px}
.disc .list button{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 9px;cursor:pointer}
.disc .list button:hover{border-color:var(--accent)}
.disc .locked{font-size:12px;color:var(--muted);font-weight:700;border:1px dashed var(--line);border-radius:999px;padding:3px 9px}

/* ATOMS */
.atoms{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.atoms .pt-card{grid-column:1/-1}
.pt-scroll{overflow-x:auto;padding:3px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));gap:3px;min-width:700px}
.ptable .pt-f{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.ptable .pt-gap{height:8px}
.ptable button{aspect-ratio:1/1.05;min-width:0;border:1px solid rgba(0,0,0,.08);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;font-weight:800}
.ptable button b{font-family:var(--display);font-weight:600;font-size:clamp(12px,1.25vw,18px)}
.ptable button small{font-size:9px;opacity:.75;margin-bottom:2px}
.ptable button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.ptable .gap{aspect-ratio:1}
.cat-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:10px}
.cat-legend span{display:flex;align-items:center;gap:6px}
.cat-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.atom-stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-box{position:relative;width:100%;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#f8fbfa}
.canvas-box canvas{display:block;width:100%;height:100%}
.atom-box{aspect-ratio:1/1;width:min(100%,560px);margin-inline:auto}
.atom-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pnc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pnc .lab-name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.pnc .lab-name i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pnc .ctr{display:flex;align-items:center;gap:8px}
.pnc .ctr button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:800;font-size:18px;cursor:pointer;line-height:1}
.pnc .ctr span{font-family:var(--display);font-weight:600;font-size:22px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.big-sym{display:flex;align-items:center;gap:14px}
.big-sym .tile{width:74px;height:74px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;border:1px solid rgba(0,0,0,.08)}
.big-sym .tile b{font-family:var(--display);font-weight:600;font-size:32px}
.big-sym .tile small{font-size:11px;font-weight:800;opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stats div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.stats span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stats b{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}

/* MOLECULES */
.mols{display:grid;grid-template-columns:250px minmax(0,1fr) 350px;gap:16px;align-items:start}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tray button{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;font-family:var(--display);font-weight:600;font-size:19px;box-shadow:inset -6px -8px 14px rgba(0,0,0,.22), 0 3px 8px rgba(0,0,0,.12);transition:transform .1s}
.tray button:hover{transform:scale(1.05)}
.tray button:active{transform:scale(.96)}
.mol-box{aspect-ratio:4/3}
.counts{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.counts span{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.chall{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto}
.chall-h{margin:8px 0 2px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chall-row{display:flex;flex-wrap:wrap;gap:5px}
.chall button.peek{border-color:#1A74B3;border-style:solid;color:#0F4F7D;background:#f2f8fc}
.chall button{cursor:pointer;background:#fff;font-family:var(--mono);font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.chall button.done{border-style:solid;background:var(--good-soft);border-color:#9fd5b5;color:var(--good-ink)}
.side{display:flex;flex-direction:column;gap:12px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(9,20,27,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-box{background:var(--panel);border-radius:18px;width:min(860px,100%);max-height:calc(100% - 8px);overflow:auto;padding:14px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.modal-box h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.zoom-box{aspect-ratio:16/9;background:#0f1d26;border-color:#0f1d26}
.zoom-cap{font-weight:700;margin:10px 0 4px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:64px;height:64px;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ghost svg{width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1200px){
  .lab{grid-template-columns:220px minmax(0,1fr)}
  .lab .guide{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .lab .guide .prof{grid-column:1/-1}
  .atoms,.mols{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .atoms .atom-info,.mols .side{grid-column:1/-1}
}
@media (max-width:760px){
  .topbar{gap:8px}
  .settings{margin-left:0;width:100%;justify-content:space-between}
  .tabs{width:100%;justify-content:space-between}
  .tabs button{flex:1 1 auto;justify-content:center;padding:8px 6px;font-size:13.5px}
  .tabs button svg{display:none}
  .lab,.atoms,.mols{grid-template-columns:minmax(0,1fr)}
  .lab .guide{display:flex}
  .shelf{position:static;order:2}
  .stage{order:1}
  .lab .guide{order:3}
  .shelf-grid{display:flex;overflow-x:auto;max-height:none;padding-bottom:6px}
  .shelf-grid .item{flex:0 0 96px}
  .banner{font-size:15px}
  .scene{aspect-ratio:4/3}
  .gauge{min-width:0;padding:5px 8px}
  .gauge .ends{display:none}
  .tray{grid-template-columns:repeat(8,1fr)}
  .tray button{font-size:17px}
  .atom-controls{grid-template-columns:1fr}
  .pnc{flex-direction:row;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  .prof .orbit{animation:none}
  .result{animation:none}
  *{scroll-behavior:auto}
}

/* v2 */
.shelf-search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:7px 10px;font:inherit;font-size:13.5px;margin-bottom:10px;color:var(--ink)}
.grp-h{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);margin:6px 2px 0}
.grp-h:first-child{margin-top:0}
